
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living 90's Trivial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        .text-glow {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #00ff00, 0 0 20px #00ff00, 0 0 25px #00ff00;
        }
        .box-glow {
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
        }
        @keyframes vhs-noise {
            0%, 100% { clip-path: inset(0 0 98% 0); }
            10% { clip-path: inset(40% 0 58% 0); }
            20% { clip-path: inset(10% 0 85% 0); }
            30% { clip-path: inset(80% 0 5% 0); }
            40% { clip-path: inset(30% 0 65% 0); }
            50% { clip-path: inset(90% 0 2% 0); }
            60% { clip-path: inset(25% 0 70% 0); }
            70% { clip-path: inset(75% 0 10% 0); }
            80% { clip-path: inset(55% 0 40% 0); }
            90% { clip-path: inset(35% 0 60% 0); }
        }
        .vhs-effect {
            position: relative;
            overflow: hidden;
        }
        .vhs-effect::before,
        .vhs-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            animation: vhs-noise 2s linear infinite alternate-reverse;
        }
    </style>
